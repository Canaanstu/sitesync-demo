# Create a PRIVATE Git repository with the contents of construction-ai at its root.
# Sign-in protected web service: the URL is reachable, project data requires login.
# Free demo: changes reset when Render replaces or restarts the instance.
services:
  - type: web
    name: sitesync-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: hosted-demo
      - key: DEMO_MODE
        value: "true"
      - key: EPHEMERAL_DEMO
        value: "true"
      - key: SITESYNC_DATA_DIR
        value: /tmp/sitesync
      - key: PRIVATE_DEMO
        value: "true"
      - key: ENABLE_EMAIL_SEND
        value: "false"
      - key: PRIVATE_DEMO_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/sitesync/construction.db
